# nginx site config for the STAC Lens container (see ../Dockerfile).
# Mirrors the headers netlify.toml declares for the hosted instance, so a
# self-hosted copy behaves the same way.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Vite emits content-hashed filenames under /assets: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # nginx's default mime map has no entry for .webmanifest; the registered
    # type is application/manifest+json.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Routing is hash-based (#<stac href>), so every real path is a real
    # file and no SPA fallback rewrite is needed. index.html and the icons
    # revalidate on every request so a new deploy shows up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
