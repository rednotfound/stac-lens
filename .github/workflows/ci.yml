# The real build on every push and pull request: `tsc -b && vite build`,
# plus lint. This exists because a type error sat unnoticed on main for a
# day while a weaker local check (`tsc --noEmit -p .`, which type-checks
# nothing against this repo's references-only tsconfig) kept reporting
# clean — see docs/DESIGN.md, "A logo, real icons, and the hierarchy
# palette". Whatever hosts the site runs the same build to deploy; this
# runs it on PRs too, before anything reaches main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The Dockerfile repeats the build inside the image; this keeps it from
      # silently rotting (a stale base image tag, a file .dockerignore hides).
      - name: Docker image builds
        run: docker build -t stac-lens .
      # Offline browser smoke test against the production build: every
      # external request is answered from tests/fixtures (see tests/smoke.mjs).
      - run: npx playwright install --with-deps chromium
      - run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 40); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 0.5; done
          BASE_URL=http://localhost:4173 npm run test:e2e
