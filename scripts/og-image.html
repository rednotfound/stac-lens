<!doctype html>
<!-- Source of public/og-image.png (1200×630), the link preview image for
     the whole site. Regenerate after changing it:
       node -e "const {chromium}=await import('playwright');" (see docs/DISCOVERABILITY.md)
     or: npx playwright screenshot --viewport-size=1200,630 scripts/og-image.html public/og-image.png -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
        background: #f7f9fa;
        color: #1a2b2f;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        box-sizing: border-box;
        position: relative;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .name {
        font-size: 72px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .tag {
        font-size: 34px;
        line-height: 1.3;
        margin: 28px 0 0;
        max-width: 980px;
        color: #144e63;
      }
      .sub {
        font-size: 24px;
        margin: 22px 0 0;
        color: #70898f;
      }
      .url {
        position: absolute;
        left: 96px;
        bottom: 56px;
        font-size: 24px;
        color: #0a7b77;
        font-weight: 600;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12px;
        background: linear-gradient(90deg, #c4e2ef 0 33.3%, #0eb4ae 33.3% 66.6%, #144e63 66.6%);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <img src="../src/assets/stac-lens-logo.svg" width="120" height="120" alt="" />
      <div class="name">STAC Lens</div>
    </div>
    <p class="tag">See the shape of your STAC data — structure, time, and space as one coordinated view.</p>
    <p class="sub">Open-source · runs in the browser · any STAC catalog or API</p>
    <div class="url">staclens.com</div>
    <div class="bar"></div>
  </body>
</html>
